[project]
name = "saco-flow"
version = "0.1.0"
description = "GPU-accelerated ecohydrological simulation using Taichi"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "taichi>=1.7.0",
]

[tool.pytest.ini_options]
markers = ["slow: long-running regression tests (60-year simulation)"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments (needed for Taichi)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/*.py" = ["E741"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
