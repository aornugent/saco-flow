[project]
name = "saco-flow"
version = "0.1.0"
description = "GPU-accelerated ecohydrological simulation using Taichi"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "taichi>=1.7.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
